<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه پوشاک هاریکا</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 13px; }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        /* کارت چرخشی */
        .flip-card {
            background-color: transparent;
            width: 100%;
            height: 280px;
            perspective: 1000px;
            cursor: pointer;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 12px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            background-color: var(--tg-theme-secondary-bg-color, #fff);
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        /* بخش تصویر و آیکون بزرگ‌نمایی */
        .img-container {
            position: relative;
            width: 100%;
            height: 160px;
        }
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .zoom-btn {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            z-index: 10;
        }
        .zoom-btn:hover {
            background-color: rgba(0, 0, 0, 0.85);
            transform: scale(1.1);
        }

        .flip-card-back {
            transform: rotateY(180deg);
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #2c3e50;
            color: #fff;
        }

        .color-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 6px 0;
        }
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid #ccc;
        }

        .product-title { font-size: 14px; font-weight: bold; margin: 4px 0; }
        .product-price { font-size: 13px; color: #27ae60; font-weight: bold; }
        .stock-tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block; }
        .in-stock { background-color: #e8f8f5; color: #27ae60; }
        .out-stock { background-color: #fadbd8; color: #e74c3c; }

        .btn-buy {
            width: 100%;
            padding: 8px;
            background-color: #0088cc;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 8px;
            cursor: pointer;
        }
        .btn-buy:disabled { background-color: #ccc; cursor: not-allowed; }

        /* استایل مدال (پنجره بزرگ‌نمایی تصویر) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            max-width: 90%;
            max-height: 80%;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
            object-fit: contain;
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #fff;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://s17.uupload.ir/files/logopng/logo.png" alt="هاریکا">
        <h2>فروشگاه پوشاک هاریکا</h2>
    </div>

    <div class="form-group">
        <label for="style">دسته لباس:</label>
        <select id="style" onchange="updateSubStyles()">
            <option value="" disabled selected>انتخاب کنید...</option>
            <option value="تیشرت">تیشرت</option>
            <option value="پیراهن">پیراهن</option>
            <option value="شلوار لی">شلوار لی</option>
            <option value="شلوار پارچه‌ای">شلوار پارچه‌ای</option>
            <option value="ست">ست</option>
            <option value="کاپشن">کاپشن</option>
        </select>
    </div>

    <div class="form-group">
        <label for="subStyle">سبک / مدل:</label>
        <select id="subStyle" onchange="updateSizes()">
            <option value="" disabled selected>ابتدا دسته را انتخاب کنید</option>
        </select>
    </div>

    <div class="form-group">
        <label for="size">سایز:</label>
        <select id="size" onchange="renderProducts()">
            <option value="" disabled selected>ابتدا سبک را انتخاب کنید</option>
        </select>
    </div>

    <div id="productsContainer" class="products-grid"></div>

    <!-- پنجره بزرگ‌نمایی عکس -->
    <div id="imageModal" class="modal" onclick="closeImageModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <!-- متصل کردن دیتابیس محصولات -->
    <script src="products.js"></script>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const alphaSizes = ["S", "M", "L", "XL", "2XL", "3XL", "4XL", "5XL"];
        const numericSizes = ["31", "32", "33", "34", "36", "38"];

        const stylesMap = {
            "تیشرت": ["تیشرت ساده", "تیشرت طرح دار", "تیشرت باکسی", "تیشرت قواره دار", "تیشرت اندامی", "تیشرت پولو شرت"],
            "پیراهن": ["پیراهن ساده", "پیراهن طرح دار", "پیراهن مجلسی", "پیراهن اداری"],
            "شلوار لی": ["شلوار مام فیت", "شلوار مام استایل", "شلوار نیم بگ", "شلوار بگ", "شلوار فول بگ", "شلوار راسته", "شلوار اسکینی"],
            "شلوار پارچه‌ای": ["شلوار پارچه‌ای اسپرت اندامی", "شلوار پارچه‌ای کلاسیک یا راسته", "شلوار پارچه‌ای مام فیت", "شلوار پارچه‌ای بگ", "شلوار پارچه‌ای کمر انگلیسی"],
            "ست": ["ست اسپرت", "ست تابستانه", "ست پاییزی", "ست هودی و شلوار"],
            "کاپشن": ["کاپشن بادی", "کاپشن چرم", "کاپشن جیر", "پافر"]
        };

        function updateSubStyles() {
            const category = document.getElementById('style').value;
            const subStyleSelect = document.getElementById('subStyle');
            const sizeSelect = document.getElementById('size');

            subStyleSelect.innerHTML = '<option value="" disabled selected>انتخاب کنید...</option>';
            sizeSelect.innerHTML = '<option value="" disabled selected>ابتدا سبک را انتخاب کنید</option>';

            (stylesMap[category] || []).forEach(sub => {
                const option = document.createElement('option');
                option.value = sub;
                option.textContent = sub;
                subStyleSelect.appendChild(option);
            });

            document.getElementById('productsContainer').innerHTML = "";
        }

        function updateSizes() {
            const category = document.getElementById('style').value;
            const sizeSelect = document.getElementById('size');

            sizeSelect.innerHTML = '<option value="" disabled selected>انتخاب کنید...</option>';

            const sizesToLoad = (category === "شلوار لی" || category === "شلوار پارچه‌ای") ? numericSizes : alphaSizes;
            sizesToLoad.forEach(size => {
                const option = document.createElement('option');
                option.value = size;
                option.textContent = size;
                sizeSelect.appendChild(option);
            });

            document.getElementById('productsContainer').innerHTML = "";
        }

        function toggleFlip(cardElement) {
            cardElement.classList.toggle('flipped');
        }

        function zoomImage(event, imgSrc) {
            event.stopPropagation(); // جلوگیری از چرخیدن کارت موقع کلیک روی ذره‌بین
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = "flex";
            modalImg.src = imgSrc;
        }

        function closeImageModal() {
            document.getElementById('imageModal').style.display = "none";
        }

        function renderProducts() {
            const category = document.getElementById('style').value;
            const subStyle = document.getElementById('subStyle').value;
            const size = document.getElementById('size').value;
            const container = document.getElementById('productsContainer');

            container.innerHTML = "";

            if (!category || !subStyle || !size) return;

            if (typeof productsDB === 'undefined') {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:red;'>خطا در بارگذاری فایل محصولات (products.js)</p>";
                return;
            }

            const filtered = productsDB.filter(p => 
                p.category === category && 
                p.subStyle === subStyle && 
                p.size === size
            );

            if (filtered.length === 0) {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#777;'>محصولی با این مشخصات یافت نشد.</p>";
                return;
            }

            filtered.forEach(p => {
                const colorsHTML = p.colors.map(c => `<span class="dot" style="background-color: ${c}"></span>`).join('');
                const isAvailable = p.stock > 0;

                const cardHTML = `
                    <div class="product-item">
                        <div class="flip-card" onclick="toggleFlip(this)">
                            <div class="flip-card-inner">
                                <div class="flip-card-front">
                                    <div class="img-container">
                                        <img src="${p.image}" alt="${p.title}">
                                        <div class="zoom-btn" onclick="zoomImage(event, '${p.image}')" title="بزرگ‌نمایی عکس">🔍</div>
                                    </div>
                                    <div class="product-title">${p.title}</div>
                                    <div class="color-dots">${colorsHTML}</div>
                                    <div class="product-price">${p.price} تومان</div>
                                    <span class="stock-tag ${isAvailable ? 'in-stock' : 'out-stock'}">
                                        ${isAvailable ? `موجود (${p.stock} عدد)` : 'ناموجود'}
                                    </span>
                                </div>
                                <div class="flip-card-back">
                                    <h4>جنس پارچه و مشخصات:</h4>
                                    <p style="font-size: 12px; line-height: 1.5;">${p.fabric}</p>
                                    <small style="margin-top: 10px; color: #bdc3c7;">(برای بازگشت کلیک کنید)</small>
                                </div>
                            </div>
                        </div>
                        <button class="btn-buy" ${!isAvailable ? 'disabled' : ''} onclick="buyProduct(${p.id})">
                            ${isAvailable ? 'خرید محصول' : 'اتمام موجودی'}
                        </button>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function buyProduct(id) {
            const product = productsDB.find(p => p.id === id);
            if (product && product.stock > 0) {
                product.stock -= 1;
                tg.showAlert(`خرید شما ثبت شد!\nمحصول: ${product.title}\nموجودی جدید: ${product.stock} عدد`);
                renderProducts();
            }
        }
    </script>
</body>
</html>
