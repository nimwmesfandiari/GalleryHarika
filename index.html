<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه پوشاک هاریکا</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --text-color: #0f172a;
            --text-muted: #475569;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --select-bg: rgba(255, 255, 255, 0.85);
            --option-bg: #ffffff;
            --option-text: #0f172a;
            --card-back-bg: rgba(255, 255, 255, 0.95);
            --modal-bg: rgba(255, 255, 255, 0.85);
            --dock-bg: rgba(255, 255, 255, 0.8);
            --price-color: #0284c7;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
                --text-color: #ffffff;
                --text-muted: rgba(255, 255, 255, 0.7);
                --glass-bg: rgba(255, 255, 255, 0.1);
                --glass-border: rgba(255, 255, 255, 0.2);
                --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                --select-bg: rgba(255, 255, 255, 0.15);
                --option-bg: #1e1b4b;
                --option-text: #ffffff;
                --card-back-bg: rgba(15, 23, 42, 0.95);
                --modal-bg: rgba(30, 27, 75, 0.9);
                --dock-bg: rgba(255, 255, 255, 0.15);
                --price-color: #38bdf8;
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 100px;
            min-height: 100vh;
        }

        /* هدر شیشه‌ای */
        .header {
            text-align: center;
            margin-bottom: 25px;
            padding: 18px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        .header img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--glass-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header h2 {
            margin: 12px 0 0 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
        }
        .required::after {
            content: " *";
            color: #ef4444;
        }

        select, input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            font-size: 14px;
            background: var(--select-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: var(--text-color);
            outline: none;
            box-shadow: var(--glass-shadow);
        }
        select:focus, input:focus, textarea:focus {
            border-color: var(--price-color);
        }
        select option {
            background-color: var(--option-bg);
            color: var(--option-text);
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            margin-top: 25px;
        }

        /* کارت چرخشی */
        .flip-card {
            background-color: transparent;
            width: 100%;
            height: 290px;
            perspective: 1000px;
            cursor: pointer;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            overflow: hidden;
            box-shadow: var(--glass-shadow);
            padding: 8px;
        }

        .img-container {
            position: relative;
            width: 100%;
            height: 155px;
            border-radius: 14px;
            overflow: hidden;
        }
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .zoom-btn {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .flip-card-back {
            transform: rotateY(180deg);
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--card-back-bg);
            color: var(--text-color);
        }

        .color-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 8px 0 4px 0;
        }
        .dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.15);
        }

        .product-title { 
            font-size: 13px; 
            font-weight: 600; 
            margin: 6px 0 2px 0; 
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .product-price { 
            font-size: 13px; 
            color: var(--price-color); 
            font-weight: 700; 
        }
        .stock-tag { 
            font-size: 10px; 
            padding: 2px 8px; 
            border-radius: 10px; 
            margin-top: 4px; 
            display: inline-block;
            font-weight: 600;
        }
        .in-stock { 
            background: rgba(16, 185, 129, 0.15); 
            color: #10b981; 
        }
        .out-stock { 
            background: rgba(239, 68, 68, 0.15); 
            color: #ef4444; 
        }

        .btn-buy, .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 13px;
            margin-top: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
        }
        .btn-buy:disabled, .btn-submit:disabled { 
            background: rgba(148, 163, 184, 0.4); 
            color: rgba(255, 255, 255, 0.6);
            box-shadow: none;
            cursor: not-allowed; 
        }

        /* پنجره‌های مدال */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            max-width: 90%;
            max-height: 80%;
            border-radius: 20px;
            object-fit: contain;
        }

        /* مدال شیشه‌ای ثبت سفارش */
        .order-modal-box {
            background: var(--modal-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .order-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .order-modal-header h3 {
            margin: 0;
            font-size: 16px;
            color: var(--text-color);
        }
        .close-btn {
            color: var(--text-color);
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* استایل‌های باکس موفقیت سفارش */
        .success-box {
            text-align: center;
            padding: 10px 0;
        }
        .success-icon {
            width: 64px;
            height: 64px;
            background: #10b981;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px auto;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }
        .success-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-color);
        }
        .tracking-box {
            background: rgba(2, 132, 199, 0.1);
            border: 1px dashed var(--price-color);
            border-radius: 12px;
            padding: 12px;
            margin: 15px 0;
        }
        .tracking-code {
            font-size: 18px;
            font-weight: 800;
            color: var(--price-color);
            letter-spacing: 1px;
            margin-top: 4px;
            direction: ltr;
        }
        .success-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* داک ارتباطی شناور */
        .glass-dock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 340px;
            height: 56px;
            background: var(--dock-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 15px;
            z-index: 999;
        }
        .dock-item {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dock-item svg {
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://s17.uupload.ir/files/logopng/logo.png" alt="هاریکا">
        <h2>فروشگاه پوشاک هاریکا</h2>
    </div>

    <div class="form-group">
        <label for="style">دسته لباس:</label>
        <select id="style" onchange="updateSubStyles()">
            <option value="" disabled selected>انتخاب کنید...</option>
            <option value="تیشرت">تیشرت</option>
            <option value="پیراهن">پیراهن</option>
            <option value="شلوار لی">شلوار لی</option>
            <option value="شلوار پارچه‌ای">شلوار پارچه‌ای</option>
            <option value="ست">ست</option>
            <option value="کاپشن">کاپشن</option>
        </select>
    </div>

    <div class="form-group">
        <label for="subStyle">سبک / مدل:</label>
        <select id="subStyle" onchange="updateSizes()">
            <option value="" disabled selected>ابتدا دسته را انتخاب کنید</option>
        </select>
    </div>

    <div class="form-group">
        <label for="size">سایز:</label>
        <select id="size" onchange="renderProducts()">
            <option value="" disabled selected>ابتدا سبک را انتخاب کنید</option>
        </select>
    </div>

    <div id="productsContainer" class="products-grid"></div>

    <!-- بزرگ‌نمایی تصویر -->
    <div id="imageModal" class="modal" onclick="closeImageModal()">
        <img class="modal-content" id="modalImage">
    </div>

    <!-- فرم شیشه‌ای دریافت مشخصات خریدار / نمایش کد پیگیری -->
    <div id="orderModal" class="modal">
        <div class="order-modal-box" id="orderModalBox">
            <div class="order-modal-header">
                <h3>تکمیل اطلاعات سفارش</h3>
                <button type="button" class="close-btn" onclick="closeOrderModal()">&times;</button>
            </div>
            <form id="orderForm" onsubmit="submitOrderForm(event)">
                <div class="form-group">
                    <label class="required">نام و نام خانوادگی:</label>
                    <input type="text" id="fullName" required placeholder="مثال: علی محمدی">
                </div>
                <div class="form-group">
                    <label class="required">شماره تلفن:</label>
                    <input type="tel" id="phoneNumber" required pattern="09[0-9]{9}" placeholder="مثال: 09123456789">
                </div>
                <div class="form-group">
                    <label>ایمیل (اختیاری):</label>
                    <input type="email" id="email" placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label class="required">کد پستی (۱۰ رقمی):</label>
                    <input type="text" id="postalCode" required pattern="[0-9]{10}" maxlength="10" placeholder="مثال: 1234567890">
                </div>
                <div class="form-group">
                    <label class="required">آدرس کامل پستی:</label>
                    <textarea id="address" rows="3" required placeholder="استان، شهر، خیابان اصلی، کوچه، پلاک، واحد"></textarea>
                </div>
                <button type="submit" id="submitBtn" class="btn-submit">تأیید و ثبت نهایی سفارش</button>
            </form>
        </div>
    </div>

    <!-- داک شناور ارتباطی -->
    <div class="glass-dock">
        <a href="https://instagram.com/gallery_harika_ard" target="_blank" class="dock-item" title="اینستاگرام">
            <svg viewBox="0 0 24 24" fill="none" stroke="#e1306c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        </a>
        <a href="https://wa.me/989144510449" target="_blank" class="dock-item" title="واتساپ">
            <svg viewBox="0 0 24 24" fill="none" stroke="#25d366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        </a>
        <!-- آیکون سبد خرید / ثبت سفارش -->
        <button class="dock-item" onclick="triggerCartClick()" title="ثبت سفارش">
            <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        </button>
        <a href="tel:04533250571" class="dock-item" title="تماس باما">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        </a>
    </div>

    <script src="products.js"></script>

    <script>
        const WORKER_URL = "https://harika-api.nimwmesfandiarii.workers.dev";
        const tg = window.Telegram?.WebApp;
        
        if (tg && tg.initData) {
            tg.ready();
            tg.expand();
        }

        let selectedProductForOrder = null;

        const alphaSizes = ["S", "M", "L", "XL", "2XL", "3XL", "4XL", "5XL"];
        const numericSizes = ["31", "32", "33", "34", "36", "38"];

        const stylesMap = {
            "تیشرت": ["تیشرت ساده", "تیشرت طرح دار", "تیشرت باکسی", "تیشرت قواره دار", "تیشرت اندامی", "تیشرت پولو شرت"],
            "پیراهن": ["پیراهن ساده", "پیراهن طرح دار", "پیراهن مجلسی", "پیراهن اداری"],
            "شلوار لی": ["شلوار مام فیت", "شلوار مام استایل", "شلوار نیم بگ", "شلوار بگ", "شلوار فول بگ", "شلوار راسته", "شلوار اسکینی"],
            "شلوار پارچه‌ای": ["شلوار پارچه‌ای اسپرت اندامی", "شلوار پارچه‌ای کلاسیک یا راسته", "شلوار پارچه‌ای مام فیت", "شلوار پارچه‌ای بگ", "شلوار پارچه‌ای کمر انگلیسی"],
            "ست": ["ست اسپرت", "ست تابستانه", "ست پاییزی", "ست هودی و شلوار"],
            "کاپشن": ["کاپشن بادی", "کاپشن چرم", "کاپشن جیر", "پافر"]
        };

        function updateSubStyles() {
            const category = document.getElementById('style').value;
            const subStyleSelect = document.getElementById('subStyle');
            const sizeSelect = document.getElementById('size');

            subStyleSelect.innerHTML = '<option value="" disabled selected>انتخاب کنید...</option>';
            sizeSelect.innerHTML = '<option value="" disabled selected>ابتدا دسته را انتخاب کنید</option>';

            (stylesMap[category] || []).forEach(sub => {
                const option = document.createElement('option');
                option.value = sub;
                option.textContent = sub;
                subStyleSelect.appendChild(option);
            });

            document.getElementById('productsContainer').innerHTML = "";
        }

        function updateSizes() {
            const category = document.getElementById('style').value;
            const sizeSelect = document.getElementById('size');

            sizeSelect.innerHTML = '<option value="" disabled selected>انتخاب کنید...</option>';

            const sizesToLoad = (category === "شلوار لی" || category === "شلوار پارچه‌ای") ? numericSizes : alphaSizes;
            sizesToLoad.forEach(size => {
                const option = document.createElement('option');
                option.value = size;
                option.textContent = size;
                sizeSelect.appendChild(option);
            });

            document.getElementById('productsContainer').innerHTML = "";
        }

        function toggleFlip(cardElement) {
            cardElement.classList.toggle('flipped');
        }

        function zoomImage(event, imgSrc) {
            event.stopPropagation();
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = "flex";
            modalImg.src = imgSrc;
        }

        function closeImageModal() {
            document.getElementById('imageModal').style.display = "none";
        }

        function renderProducts() {
            const category = document.getElementById('style').value;
            const subStyle = document.getElementById('subStyle').value;
            const size = document.getElementById('size').value;
            const container = document.getElementById('productsContainer');

            container.innerHTML = "";

            if (!category || !subStyle || !size) return;

            if (typeof productsDB === 'undefined') {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#ef4444;'>خطا در بارگذاری فایل محصولات (products.js)</p>";
                return;
            }

            const filtered = productsDB.filter(p => 
                p.category === category && 
                p.subStyle === subStyle && 
                p.size === size
            );

            if (filtered.length === 0) {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:var(--text-muted);'>محصولی با این مشخصات یافت نشد.</p>";
                return;
            }

            filtered.forEach(p => {
                const colorsHTML = p.colors.map(c => `<span class="dot" style="background-color: ${c}"></span>`).join('');
                const isAvailable = p.stock > 0;

                const cardHTML = `
                    <div class="product-item">
                        <div class="flip-card" onclick="toggleFlip(this)">
                            <div class="flip-card-inner">
                                <div class="flip-card-front">
                                    <div class="img-container">
                                        <img src="${p.image}" alt="${p.title}">
                                        <div class="zoom-btn" onclick="zoomImage(event, '${p.image}')" title="بزرگ‌نمایی عکس">🔍</div>
                                    </div>
                                    <div class="product-title">${p.title}</div>
                                    <div class="color-dots">${colorsHTML}</div>
                                    <div class="product-price">${p.price} تومان</div>
                                    <span class="stock-tag ${isAvailable ? 'in-stock' : 'out-stock'}">
                                        ${isAvailable ? `موجود (${p.stock} عدد)` : 'ناموجود'}
                                    </span>
                                </div>
                                <div class="flip-card-back">
                                    <h4 style="margin:0 0 8px 0; font-size:14px; color:var(--price-color);">جنس پارچه و مشخصات:</h4>
                                    <p style="font-size: 12px; line-height: 1.6; color:var(--text-color);">${p.fabric}</p>
                                    <small style="margin-top: auto; color: var(--text-muted); font-size:10px;">(برای بازگشت کلیک کنید)</small>
                                </div>
                            </div>
                        </div>
                        <button class="btn-buy" ${!isAvailable ? 'disabled' : ''} onclick="openOrderModal(${p.id})">
                            ${isAvailable ? 'ثبت سفارش' : 'اتمام موجودی'}
                        </button>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function triggerCartClick() {
            const firstAvailableBtn = document.querySelector('.btn-buy:not([disabled])');
            if (firstAvailableBtn) {
                firstAvailableBtn.click();
            } else {
                const message = "لطفاً ابتدا محصول مورد نظر خود را از فیلترهای بالا انتخاب کنید.";
                if (tg?.showAlert) {
                    tg.showAlert(message);
                } else {
                    alert(message);
                }
            }
        }

        function resetOrderModal() {
            const modalBox = document.getElementById('orderModalBox');
            modalBox.innerHTML = `
                <div class="order-modal-header">
                    <h3>تکمیل اطلاعات سفارش</h3>
                    <button type="button" class="close-btn" onclick="closeOrderModal()">&times;</button>
                </div>
                <form id="orderForm" onsubmit="submitOrderForm(event)">
                    <div class="form-group">
                        <label class="required">نام و نام خانوادگی:</label>
                        <input type="text" id="fullName" required placeholder="مثال: علی محمدی">
                    </div>
                    <div class="form-group">
                        <label class="required">شماره تلفن:</label>
                        <input type="tel" id="phoneNumber" required pattern="09[0-9]{9}" placeholder="مثال: 09123456789">
                    </div>
                    <div class="form-group">
                        <label>ایمیل (اختیاری):</label>
                        <input type="email" id="email" placeholder="example@gmail.com">
                    </div>
                    <div class="form-group">
                        <label class="required">کد پستی (۱۰ رقمی):</label>
                        <input type="text" id="postalCode" required pattern="[0-9]{10}" maxlength="10" placeholder="مثال: 1234567890">
                    </div>
                    <div class="form-group">
                        <label class="required">آدرس کامل پستی:</label>
                        <textarea id="address" rows="3" required placeholder="استان، شهر، خیابان اصلی، کوچه، پلاک، واحد"></textarea>
                    </div>
                    <button type="submit" id="submitBtn" class="btn-submit">تأیید و ثبت نهایی سفارش</button>
                </form>
            `;
        }

        function openOrderModal(productId) {
            const product = productsDB.find(p => p.id === productId);
            if (!product || product.stock <= 0) return;

            selectedProductForOrder = product;
            resetOrderModal();
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeOrderModal() {
            document.getElementById('orderModal').style.display = 'none';
            selectedProductForOrder = null;
        }

        function generateTrackingCode() {
            const randomNum = Math.floor(100000 + Math.random() * 900000);
            return `HARIKA-${randomNum}`;
        }

        async function submitOrderForm(event) {
            event.preventDefault();
            if (!selectedProductForOrder) return;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "در حال ثبت سفارش...";

            const fullName = document.getElementById('fullName').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const email = document.getElementById('email').value.trim();
            const postalCode = document.getElementById('postalCode').value.trim();
            const address = document.getElementById('address').value.trim();

            const trackingCode = generateTrackingCode();

            const user = tg?.initDataUnsafe?.user;
            const userId = user?.id ? String(user.id) : "WebUser";
            const username = user?.username ? `@${user.username}` : (user?.first_name || "کاربر وب");

            const orderData = {
                trackingCode: trackingCode,
                productId: selectedProductForOrder.id,
                productTitle: selectedProductForOrder.title,
                price: String(selectedProductForOrder.price),
                userId: userId,
                username: username,
                fullName: fullName,
                phoneNumber: phoneNumber,
                email: email,
                postalCode: postalCode,
                address: address
            };

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(orderData)
                });

                const result = await response.json();

                if (result.success) {
                    selectedProductForOrder.stock -= 1;
                    
                    const modalBox = document.getElementById('orderModalBox');
                    modalBox.innerHTML = `
                        <div class="success-box">
                            <div class="success-icon">✓</div>
                            <div class="success-title">سفارش با موفقیت ثبت شد 🎉</div>
                            <div class="tracking-box">
                                <span style="font-size:12px; color:var(--text-muted);">کد پیگیری شما:</span>
                                <div class="tracking-code">${trackingCode}</div>
                            </div>
                            <div class="success-desc">
                                اطلاعات سفارش شما با موفقیت در سیستم فروشگاه ثبت شد.<br>
                                لطفاً این کد پیگیری را نزد خود برای پیگیری‌های بعدی نگه دارید.
                            </div>
                            <button class="btn-submit" onclick="closeOrderModal()">بازگشت به فروشگاه</button>
                        </div>
                    `;

                    renderProducts();
                } else {
                    throw new Error(result.error || "خطا در ثبت سفارش");
                }
            } catch (err) {
                console.error("Error submitting order:", err);
                const errorMsg = "مشکلی در ثبت سفارش پیش آمد: " + err.message;
                
                if (tg?.showAlert) {
                    tg.showAlert(errorMsg);
                } else {
                    alert(errorMsg);
                }
                submitBtn.disabled = false;
                submitBtn.innerText = "تأیید و ثبت نهایی سفارش";
            }
        }
    </script>
</body>
</html>
