<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار هوشمند خرید لباس</title>
    <!-- SDK رسمی مینی‌اپ تلگرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #results { margin-top: 20px; }
        .result-box {
            background-color: var(--tg-theme-secondary-bg-color, #f9f9f9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            white-space: pre-line;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
        <h2>دستیار هوشمند استایل اسپرت مردانه</h2>
    </div>

    <div class="form-group">
        <label for="budget">حداکثر بودجه (تومان):</label>
        <input type="number" id="budget" placeholder="مثلاً ۱,۵۰۰,۰۰۰">
    </div>

    <div class="form-group">
        <label for="style">سبک لباس:</label>
        <select id="style">
            <option value="casual_sport">اسپورت / کژوال روزمره</option>
            <option value="streetwear">استریت‌ویر / لش (Streetwear)</option>
            <option value="hoodie_sweatshirt">هودی، دورس و سوییشرت</option>
            <option value="minimal_sport">اسپورت مینیمال</option>
        </select>
    </div>

    <button id="submitBtn" onclick="findClothes()">پیشنهاد هوشمند ست لباس</button>

    <div id="results"></div>

    <script>
        // مقداردهی اولیه تلگرام
        const tg = window.Telegram.WebApp;
        tg.expand();

        // کلید اختصاصی API شما
        const API_KEY = "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"; 

        async function findClothes() {
            const budget = document.getElementById('budget').value;
            const style = document.getElementById('style').value;
            const resultsDiv = document.getElementById('results');
            const submitBtn = document.getElementById('submitBtn');

            if (!budget || budget <= 0) {
                tg.showAlert('لطفاً یک بودجه معتبر به تومان وارد کنید.');
                return;
            }

            submitBtn.disabled = true;
            resultsDiv.innerHTML = "<p style='text-align:center;'>⏳ در حال تحلیل استایل و یافتن بهترین ست اسپرت با AI...</p>";

            const prompt = `تو یک استایلیست حرفه‌ای پوشاک اسپرت و کژوال مردانه هستی. 
            کاربر یک ست لباس کامل در سبک "${style}" با حداکثر بودجه کل ${budget} تومان می‌خواهد.
            قوانین مهم:
            ۱. تمام قیمت‌ها حتماً به تومان باشند.
            ۲. به هیچ عنوان کت‌وشلوار، لباس رسمی، یا لباس ورزشی تخصصی پیشنهاد نده. فقط پوشاک کژوال/اسپرت مثل تیشرت، دورس، هودی، شلوار جین، جاگر، کتان اسپرت و اکسسوری.
            ۳. ۲ یا ۳ آیتم اصلی را پیشنهاد بده (مثلاً تیشرت + شلوار جین).
            ۴. برای هر آیتم: نام آیتم، قیمت حدودی به تومان و دلیل ست شدن را بنویس.
            ۵. در انتهای پاسخ، مجموع قیمت‌ها را حساب کن تا از ${budget} تومان بیشتر نشود.
            پاسخ را بسیار شیک، مرتب و به زبان فارسی بنویس.`;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: prompt }],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0]) {
                    const aiResponse = data.choices[0].message.content;
                    
                    resultsDiv.innerHTML = `
                        <div class="result-box">
                            <h3>✨ ست اسپرت پیشنهادی هوش مصنوعی:</h3>
                            ${aiResponse}
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = "<p style='color:red;'>خطا در دریافت پاسخ از AI. لطفاً اتصال را بررسی کنید.</p>";
                }

            } catch (error) {
                console.error(error);
                resultsDiv.innerHTML = "<p style='color:red;'>خطایی در ارتباط با سرور رخ داد. اتصال اینترنت خود را بررسی کنید.</p>";
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
