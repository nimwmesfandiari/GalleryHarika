<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار هوشمند خرید لباس - هاریکا</title>
    <!-- SDK رسمی مینی‌اپ تلگرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #results { margin-top: 20px; }
        .result-box {
            background-color: var(--tg-theme-secondary-bg-color, #f9f9f9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            white-space: pre-line;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- لینک مستقیم لوگوی شما -->
        <img src="https://s17.uupload.ir/files/logopng/logo.png" alt="هاریکا">
        <h2>دستیار هوشمند خرید پوشاک مردانه</h2>
    </div>

    <div class="form-group">
        <label for="budget">حداکثر بودجه (تومان):</label>
        <input type="number" id="budget" placeholder="مثلاً ۱,۵۰۰,۰۰۰">
    </div>

    <div class="form-group">
        <label for="style">دسته / نوع لباس:</label>
        <select id="style" onchange="updateSizes()">
            <option value="تیشرت">تیشرت</option>
            <option value="پیراهن">پیراهن</option>
            <option value="شلوار لی">شلوار لی</option>
            <option value="شلوار پارچه‌ای">شلوار پارچه‌ای</option>
            <option value="ست">ست</option>
            <option value="کاپشن ژاکت">کاپشن ژاکت</option>
        </select>
    </div>

    <div class="form-group">
        <label for="size">سایز لباس:</label>
        <select id="size">
            <!-- گزینه‌ها به‌صورت پویا توسط اسکریپت مدیریت می‌شوند -->
        </select>
    </div>

    <button id="submitBtn" onclick="findClothes()">پیشنهاد هوشمند با AI</button>

    <div id="results"></div>

    <script>
        // مقداردهی اولیه تلگرام
        const tg = window.Telegram.WebApp;
        tg.expand();

        // لیست سایزها
        const alphaSizes = ["S", "M", "L", "XL", "2XL", "3XL", "4XL", "5XL"];
        const numericSizes = ["31", "32", "33", "34", "36", "38"];

        // تغییر پویا گزینه‌های سایز بر اساس دسته لباس
        function updateSizes() {
            const category = document.getElementById('style').value;
            const sizeSelect = document.getElementById('size');
            sizeSelect.innerHTML = "";

            const sizesToLoad = (category === "شلوار لی" || category === "شلوار پارچه‌ای") ? numericSizes : alphaSizes;

            sizesToLoad.forEach(size => {
                const option = document.createElement('option');
                option.value = size;
                option.textContent = size;
                if (size === "XL" || size === "32") option.selected = true;
                sizeSelect.appendChild(option);
            });
        }

        // بارگذاری اولیه سایزها
        updateSizes();

        // کلید اختصاصی API شما
        const API_KEY = "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"; 

        async function findClothes() {
            const budget = document.getElementById('budget').value;
            const category = document.getElementById('style').value;
            const size = document.getElementById('size').value;
            const resultsDiv = document.getElementById('results');
            const submitBtn = document.getElementById('submitBtn');

            if (!budget || budget <= 0) {
                tg.showAlert('لطفاً یک بودجه معتبر به تومان وارد کنید.');
                return;
            }

            submitBtn.disabled = true;
            resultsDiv.innerHTML = "<p style='text-align:center;'>⏳ در حال تحلیل و پیشنهاد بهترین گزینه با AI...</p>";

            const prompt = `تو یک مشاور فروش حرفه‌ای در فروشگاه پوشاک مردانه "هاریکا" هستی. 
            کاربر قصد خرید در دسته "${category}" با سایز "${size}" و حداکثر بودجه ${budget} تومان دارد.
            قوانین مهم:
            ۱. تمام قیمت‌ها حتماً به تومان و متناسب با بودجه ${budget} تومان باشد.
            ۲. حتماً در پاسخ قید کن که مدل‌های پیشنهادی برای سایز ${size} مناسب و موجود هستند.
            ۳. اگر دسته انتخاب‌شده "ست" است، ۲ یا ۳ آیتم پیشنهادی برای ساخت یک ست شیک معرفی کن. در غیر این صورت، مدل‌های مختلف و پیشنهادی از دسته "${category}" را مشخص کن.
            ۴. برای هر آیتم پیشنهادی، نام مدل/استایل، قیمت حدودی به تومان و علت پیشنهاد را بنویس.
            ۵. مجموع قیمت نباید از ${budget} تومان فراتر برود.
            پاسخ را بسیار شیک، جذاب و به زبان فارسی مرتب بنویس.`;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: prompt }],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0]) {
                    const aiResponse = data.choices[0].message.content;
                    
                    resultsDiv.innerHTML = `
                        <div class="result-box">
                            <h3>✨ پیشنهاد هوشمند فروشگاه هاریکا:</h3>
                            ${aiResponse}
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = "<p style='color:red;'>خطا در دریافت پاسخ از AI. لطفاً دوباره تلاش کنید.</p>";
                }

            } catch (error) {
                console.error(error);
                resultsDiv.innerHTML = "<p style='color:red;'>خطایی در ارتباط با سرور رخ داد. اتصال اینترنت خود را بررسی کنید.</p>";
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
